<svg xmlns="http://www.w3.org/2000/svg" viewBox="-58 -44 116 98">
	<defs>
		<linearGradient id="pcb" x1="0" y1="-36" x2="0" y2="34" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#2b62a6" />
			<stop offset="1" stop-color="#1a3f70" />
		</linearGradient>
	</defs>
	<g stroke-linecap="round">
		<rect x="-52" y="-36" width="104" height="70" rx="3" fill="url(#pcb)" stroke="#12325c" stroke-width="1.2" />
		<circle cx="-45" cy="-29" r="2.2" fill="#0d2547" />
		<circle cx="45" cy="-29" r="2.2" fill="#0d2547" />

		<!-- rotary encoder -->
		<circle cx="-34" cy="-14" r="10" fill="#2f6bd0" stroke="#1e4a94" stroke-width="1" />
		<circle cx="-34" cy="-14" r="5.4" fill="#d7dde3" stroke="#7f8a94" stroke-width="0.9" />
		<path d="M-34 -17.5 v7" stroke="#7f8a94" stroke-width="1.1" />

		<!-- waveform glyphs -->
		<g fill="none" stroke="#bfe3ff" stroke-width="1.3">
			<path d="M-16 -24 h6 v-8 h6 v8 h6" />
			<path d="M-16 -8 c4 -9 10 -9 14 0" />
			<path d="M-16 6 l6 -8 l6 8 z" />
			<path d="M-16 18 l0 -8 l12 6 l0 -8" />
		</g>
		<g fill="#bfe3ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="2.8" text-anchor="middle">
			<text x="10" y="-25">SQ</text>
			<text x="10" y="-9">SIN</text>
			<text x="10" y="7">TRI</text>
			<text x="10" y="19">SAW</text>
		</g>
		<text x="30" y="-2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.2" fill="#9fc4ec" text-anchor="middle">1k</text>
		<text x="30" y="6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.2" fill="#9fc4ec" text-anchor="middle">Hz</text>

		<!-- 2-pin header -->
		<rect x="-40" y="28" width="80" height="9" rx="1.5" fill="#161616" />
		<g stroke="#b7bdc2" stroke-width="2.2">
			<line x1="-30" y1="30" x2="-30" y2="40" />
			<line x1="30" y1="30" x2="30" y2="40" />
		</g>
		<g fill="#d5af52" stroke="#a8843a" stroke-width="0.6">
			<rect x="-32.5" y="37.5" width="5" height="5" rx="1" />
			<rect x="27.5" y="37.5" width="5" height="5" rx="1" />
		</g>
		<g fill="#d9e7f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.4" text-anchor="middle">
			<text x="-30" y="26">OUT</text>
			<text x="30" y="26">GND</text>
		</g>
	</g>
</svg>
