<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -46 100 94">
	<defs>
		<linearGradient id="pcb" x1="0" y1="-34" x2="0" y2="34" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#2e7d4c" />
			<stop offset="1" stop-color="#1c5c36" />
		</linearGradient>
		<linearGradient id="chip" x1="0" y1="-18" x2="0" y2="8" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#d7dbde" />
			<stop offset="1" stop-color="#8d959a" />
		</linearGradient>
	</defs>
	<g stroke-linecap="round">
		<rect x="-40" y="-34" width="80" height="68" rx="3" fill="url(#pcb)" stroke="#0f3f24" stroke-width="1.2" />
		<circle cx="-34" cy="-28" r="2.2" fill="#0c3220" />
		<circle cx="34" cy="-28" r="2.2" fill="#0c3220" />

		<!-- flex tail up to the touch panel -->
		<rect x="-26" y="-44" width="52" height="12" rx="1.5" fill="#c9a227" stroke="#9c7c1c" stroke-width="0.8" />
		<g fill="#a8871f">
			<rect x="-22" y="-42" width="2" height="8" />
			<rect x="-13" y="-42" width="2" height="8" />
			<rect x="-4" y="-42" width="2" height="8" />
			<rect x="5" y="-42" width="2" height="8" />
			<rect x="14" y="-42" width="2" height="8" />
		</g>

		<!-- XPT2046 die -->
		<rect x="-16" y="-18" width="32" height="26" rx="2" fill="url(#chip)" stroke="#5f676c" stroke-width="1" />
		<circle cx="-11" cy="-13" r="1.4" fill="#6b7378" />
		<g fill="#5f676c">
			<rect x="-20" y="-14" width="4" height="3" />
			<rect x="-20" y="-8" width="4" height="3" />
			<rect x="-20" y="-2" width="4" height="3" />
			<rect x="-20" y="4" width="4" height="3" />
			<rect x="16" y="-14" width="4" height="3" />
			<rect x="16" y="-8" width="4" height="3" />
			<rect x="16" y="-2" width="4" height="3" />
			<rect x="16" y="4" width="4" height="3" />
		</g>
		<text x="0" y="2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.6" fill="#4c5459" text-anchor="middle">XPT2046</text>

		<rect x="-24" y="14" width="20" height="10" rx="1.4" fill="#1d2124" />
		<text x="10" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.4" letter-spacing="1.2" fill="#bfe8cb" text-anchor="middle">TOUCH</text>

		<!-- 7-pin header -->
		<rect x="-49" y="31" width="98" height="9" rx="1.5" fill="#161616" />
		<g stroke="#b7bdc2" stroke-width="2.2">
			<line x1="-45" y1="34" x2="-45" y2="38" />
			<line x1="-30" y1="34" x2="-30" y2="38" />
			<line x1="-15" y1="34" x2="-15" y2="38" />
			<line x1="0" y1="34" x2="0" y2="38" />
			<line x1="15" y1="34" x2="15" y2="38" />
			<line x1="30" y1="34" x2="30" y2="38" />
			<line x1="45" y1="34" x2="45" y2="38" />
		</g>
		<g fill="#d5af52" stroke="#a8843a" stroke-width="0.6">
			<rect x="-47.5" y="35.5" width="5" height="5" rx="1" />
			<rect x="-32.5" y="35.5" width="5" height="5" rx="1" />
			<rect x="-17.5" y="35.5" width="5" height="5" rx="1" />
			<rect x="-2.5" y="35.5" width="5" height="5" rx="1" />
			<rect x="12.5" y="35.5" width="5" height="5" rx="1" />
			<rect x="27.5" y="35.5" width="5" height="5" rx="1" />
			<rect x="42.5" y="35.5" width="5" height="5" rx="1" />
		</g>
		<g fill="#d6f2de" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.2" text-anchor="middle">
			<text x="-45" y="29.5">VCC</text>
			<text x="-30" y="29.5">GND</text>
			<text x="-15" y="29.5">CS</text>
			<text x="0" y="29.5">CLK</text>
			<text x="15" y="29.5">DIN</text>
			<text x="30" y="29.5">DOUT</text>
			<text x="45" y="29.5">IRQ</text>
		</g>
	</g>
</svg>
