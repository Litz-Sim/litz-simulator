<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -58 128 116">
	<defs>
		<linearGradient id="shell" x1="0" y1="-30" x2="0" y2="40" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#f1f3f4" />
			<stop offset="0.6" stop-color="#dfe3e6" />
			<stop offset="1" stop-color="#bcc3c8" />
		</linearGradient>
		<linearGradient id="ant" x1="0" y1="-56" x2="0" y2="-28" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#4a5157" />
			<stop offset="1" stop-color="#23272a" />
		</linearGradient>
	</defs>
	<g stroke-linecap="round">
		<!-- antennas -->
		<path d="M-36 -30 L-46 -56 h10 L-26 -32 Z" fill="url(#ant)" stroke="#17191b" stroke-width="0.9" />
		<path d="M14 -30 L8 -56 h10 L24 -32 Z" fill="url(#ant)" stroke="#17191b" stroke-width="0.9" />
		<path d="M-40 -56 a5 4 0 0 1 10 0" fill="#3c4247" />
		<path d="M12 -56 a5 4 0 0 1 10 0" fill="#3c4247" />

		<!-- body -->
		<rect x="-50" y="-30" width="100" height="70" rx="6" fill="url(#shell)" stroke="#8f979d" stroke-width="1.2" />
		<rect x="-46" y="-26" width="92" height="62" rx="4" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.7" />

		<!-- vents -->
		<g stroke="#a8b0b6" stroke-width="1.1">
			<line x1="-26" y1="0" x2="26" y2="0" />
			<line x1="-26" y1="4" x2="26" y2="4" />
			<line x1="-26" y1="8" x2="26" y2="8" />
		</g>

		<!-- status LEDs -->
		<circle cx="-24" cy="18" r="2.6" fill="#7fd18a" stroke="#4f9b5c" stroke-width="0.7" />
		<circle cx="-12" cy="18" r="2.6" fill="#f4c542" stroke="#b78e1f" stroke-width="0.7" />
		<circle cx="0" cy="18" r="2.6" fill="#7fd18a" stroke="#4f9b5c" stroke-width="0.7" />
		<circle cx="12" cy="18" r="2.6" fill="#3e464b" />

		<text x="4" y="-10" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7" font-weight="600" letter-spacing="1.6" fill="#4a5257" text-anchor="middle">Wi-Fi</text>
		<text x="4" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.2" letter-spacing="1.6" fill="#7d858a" text-anchor="middle">ROUTER</text>

		<!-- LAN ports -->
		<g fill="#3c4247">
			<rect x="-40" y="32" width="12" height="7" rx="1" />
			<rect x="-24" y="32" width="12" height="7" rx="1" />
			<rect x="-8" y="32" width="12" height="7" rx="1" />
			<rect x="8" y="32" width="12" height="7" rx="1" />
		</g>

		<!-- 2-pin header -->
		<rect x="-30" y="40" width="60" height="9" rx="1.5" fill="#161616" />
		<g stroke="#b7bdc2" stroke-width="2.2">
			<line x1="-20" y1="42" x2="-20" y2="44" />
			<line x1="20" y1="42" x2="20" y2="44" />
		</g>
		<g fill="#d5af52" stroke="#a8843a" stroke-width="0.6">
			<rect x="-22.5" y="41.5" width="5" height="5" rx="1" />
			<rect x="17.5" y="41.5" width="5" height="5" rx="1" />
		</g>
		<g fill="#4a5257" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3" text-anchor="middle">
			<text x="-20" y="38.5">3V3</text>
			<text x="20" y="38.5">GND</text>
		</g>
	</g>
</svg>
