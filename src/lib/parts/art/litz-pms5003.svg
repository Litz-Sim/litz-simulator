<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -46 104 96">
	<defs>
		<linearGradient id="case" x1="0" y1="-40" x2="0" y2="30" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#565d62" />
			<stop offset="1" stop-color="#2c3134" />
		</linearGradient>
	</defs>
	<g stroke-linecap="round">
		<rect x="-42" y="-40" width="84" height="70" rx="5" fill="url(#case)" stroke="#17191b" stroke-width="1.3" />
		<rect x="-37" y="-35" width="74" height="60" rx="3" fill="none" stroke="#6b7378" stroke-width="0.8" opacity="0.5" />

		<!-- fan grille -->
		<circle cx="-14" cy="-10" r="19" fill="#24282b" stroke="#111315" stroke-width="1.2" />
		<g fill="none" stroke="#4c5257" stroke-width="1">
			<circle cx="-14" cy="-10" r="15.5" />
			<circle cx="-14" cy="-10" r="11" />
			<circle cx="-14" cy="-10" r="6.5" />
		</g>
		<g stroke="#585f64" stroke-width="1.4">
			<line x1="-14" y1="-10" x2="-14" y2="-25" />
			<line x1="-14" y1="-10" x2="-1" y2="-3" />
			<line x1="-14" y1="-10" x2="-14" y2="5" />
			<line x1="-14" y1="-10" x2="-27" y2="-3" />
		</g>
		<circle cx="-14" cy="-10" r="3.4" fill="#343a3e" stroke="#4c5257" stroke-width="0.8" />

		<!-- intake slots -->
		<g fill="#22262a">
			<rect x="11" y="-27" width="4.5" height="34" rx="2.2" />
			<rect x="19" y="-27" width="4.5" height="34" rx="2.2" />
			<rect x="27" y="-27" width="4.5" height="34" rx="2.2" />
			<rect x="35" y="-27" width="4.5" height="34" rx="2.2" />
		</g>

		<!-- side connector -->
		<rect x="42" y="-18" width="9" height="19" rx="1" fill="#161616" stroke="#0a0b0c" stroke-width="0.8" />
		<rect x="48.5" y="-14" width="3" height="11" rx="0.8" fill="#3c4246" />

		<text x="-10" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="4.6" fill="#c8d0d6" text-anchor="middle">PMS5003</text>
		<text x="-10" y="29" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.2" letter-spacing="0.8" fill="#9aa2a7" text-anchor="middle">PM2.5</text>

		<!-- 4-pin header -->
		<rect x="-40" y="30" width="80" height="9" rx="1.5" fill="#161616" />
		<g stroke="#b7bdc2" stroke-width="2.2">
			<line x1="-30" y1="32" x2="-30" y2="40" />
			<line x1="-10" y1="32" x2="-10" y2="40" />
			<line x1="10" y1="32" x2="10" y2="40" />
			<line x1="30" y1="32" x2="30" y2="40" />
		</g>
		<g fill="#d5af52" stroke="#a8843a" stroke-width="0.6">
			<rect x="-32.5" y="37.5" width="5" height="5" rx="1" />
			<rect x="-12.5" y="37.5" width="5" height="5" rx="1" />
			<rect x="7.5" y="37.5" width="5" height="5" rx="1" />
			<rect x="27.5" y="37.5" width="5" height="5" rx="1" />
		</g>
		<g fill="#d6f2de" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.2" text-anchor="middle">
			<text x="-30" y="28">VCC</text>
			<text x="-10" y="28">GND</text>
			<text x="10" y="28">TX</text>
			<text x="30" y="28">RX</text>
		</g>
	</g>
</svg>
