<svg xmlns="http://www.w3.org/2000/svg" viewBox="-102 -136 204 272">
	<defs>
		<linearGradient id="pcb" x1="0" y1="-125" x2="0" y2="125" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#202226" />
			<stop offset="0.55" stop-color="#17181b" />
			<stop offset="1" stop-color="#101113" />
		</linearGradient>
		<linearGradient id="can" x1="-40" y1="8" x2="40" y2="120" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#e5e9ec" />
			<stop offset="0.42" stop-color="#c6ccd1" />
			<stop offset="1" stop-color="#9aa2a8" />
		</linearGradient>
