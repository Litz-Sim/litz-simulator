<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -74 144 148">
	<defs>
		<linearGradient id="pcb" x1="0" y1="-60" x2="0" y2="50" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#275f9e" />
			<stop offset="1" stop-color="#173f6b" />
		</linearGradient>
		<linearGradient id="shield" x1="0" y1="-52" x2="0" y2="-8" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#e3e7ea" />
			<stop offset="0.55" stop-color="#b8c0c6" />
			<stop offset="1" stop-color="#8b9399" />
		</linearGradient>
	</defs>
	<g stroke-linecap="round">
		<rect x="-60" y="-60" width="120" height="110" rx="3" fill="url(#pcb)" stroke="#102b4a" stroke-width="1.2" />
		<circle cx="-52" cy="-52" r="2.3" fill="#0d2547" />
		<circle cx="52" cy="-52" r="2.3" fill="#0d2547" />

		<!-- PCB antenna meander -->
		<path d="M-54 -44 v26 M-54 -44 h8 v8 h-8 M-54 -36 h8 M-46 -28 v-8" fill="none" stroke="#d8b45a" stroke-width="1.5" />
		<path d="M-54 -18 h8 v8 h-8 v8 h8" fill="none" stroke="#d8b45a" stroke-width="1.5" />

		<!-- RF shield -->
		<rect x="-34" y="-52" width="68" height="46" rx="2.5" fill="url(#shield)" stroke="#6f787e" stroke-width="1.1" />
		<g stroke="#a2aab0" stroke-width="0.7" opacity="0.8">
			<line x1="-30" y1="-48" x2="-30" y2="-10" />
			<line x1="-22" y1="-48" x2="-22" y2="-10" />
			<line x1="-14" y1="-48" x2="-14" y2="-10" />
			<line x1="-6" y1="-48" x2="-6" y2="-10" />
			<line x1="2" y1="-48" x2="2" y2="-10" />
			<line x1="10" y1="-48" x2="10" y2="-10" />
			<line x1="18" y1="-48" x2="18" y2="-10" />
			<line x1="26" y1="-48" x2="26" y2="-10" />
		</g>
		<rect x="-2" y="-42" width="30" height="16" rx="1.5" fill="#c3cad0" opacity="0.75" />
		<text x="13" y="-32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="4.6" font-weight="600" fill="#3c4247" text-anchor="middle">nRF24L01+</text>

		<!-- crystal and passives -->
		<rect x="40" y="-56" width="12" height="7" rx="3" fill="#cfd5da" stroke="#7d858a" stroke-width="0.8" />
		<rect x="40" y="0" width="8" height="5" rx="1" fill="#1d2124" />

		<text x="8" y="8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.4" letter-spacing="1" fill="#a9c6e8" text-anchor="middle">2.4 GHz</text>

		<!-- 8-pin header -->
		<rect x="-62" y="50" width="124" height="10" rx="1.5" fill="#161616" />
		<g stroke="#b7bdc2" stroke-width="2.2">
			<line x1="-56" y1="52" x2="-56" y2="58" />
			<line x1="-40" y1="52" x2="-40" y2="58" />
			<line x1="-24" y1="52" x2="-24" y2="58" />
			<line x1="-8" y1="52" x2="-8" y2="58" />
			<line x1="8" y1="52" x2="8" y2="58" />
			<line x1="24" y1="52" x2="24" y2="58" />
			<line x1="40" y1="52" x2="40" y2="58" />
			<line x1="56" y1="52" x2="56" y2="58" />
		</g>
		<g fill="#d5af52" stroke="#a8843a" stroke-width="0.6">
			<rect x="-58.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="-42.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="-26.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="-10.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="5.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="21.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="37.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="53.5" y="55.5" width="5" height="5" rx="1" />
		</g>
		<g fill="#d9e7f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="2.9" text-anchor="middle">
			<text x="-56" y="47">VCC</text>
			<text x="-40" y="47">GND</text>
			<text x="-24" y="47">SCK</text>
			<text x="-8" y="47">MOSI</text>
			<text x="8" y="47">MISO</text>
			<text x="24" y="47">CSN</text>
			<text x="40" y="47">CE</text>
			<text x="56" y="47">IRQ</text>
		</g>
	</g>
</svg>
