<svg xmlns="http://www.w3.org/2000/svg" viewBox="-54 -72 108 144">
	<defs>
		<linearGradient id="pcb" x1="0" y1="-60" x2="0" y2="52" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#2e7d4c" />
			<stop offset="1" stop-color="#1a5632" />
		</linearGradient>
		<linearGradient id="holder" x1="0" y1="-56" x2="0" y2="-28" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#e6eaed" />
			<stop offset="0.55" stop-color="#b9c0c6" />
			<stop offset="1" stop-color="#8a9298" />
		</linearGradient>
	</defs>
	<g stroke-linecap="round">
		<rect x="-44" y="-60" width="88" height="112" rx="4" fill="url(#pcb)" stroke="#0f3f24" stroke-width="1.2" />
		<circle cx="-36" cy="-52" r="2.3" fill="#0c3220" />
		<circle cx="36" cy="-52" r="2.3" fill="#0c3220" />
		<circle cx="-36" cy="44" r="2.3" fill="#0c3220" />
		<circle cx="36" cy="44" r="2.3" fill="#0c3220" />

		<!-- microSD card emerging from the socket -->
		<path d="M-25 -68 h24 a3 3 0 0 1 3 3 v20 h-30 v-20 a3 3 0 0 1 3 -3 z" fill="#2a2f3a" stroke="#14171d" stroke-width="1" />
		<path d="M-25 -68 h7 l-7 7 z" fill="#3c424d" />
		<g fill="#d8b45a">
			<rect x="-23" y="-58" width="3" height="9" rx="0.5" />
			<rect x="-18" y="-58" width="3" height="9" rx="0.5" />
			<rect x="-13" y="-58" width="3" height="9" rx="0.5" />
			<rect x="-8" y="-58" width="3" height="9" rx="0.5" />
			<rect x="-3" y="-58" width="3" height="9" rx="0.5" />
		</g>

		<!-- metal socket -->
		<rect x="-31" y="-54" width="62" height="26" rx="2.5" fill="url(#holder)" stroke="#6f787e" stroke-width="1" />
		<rect x="-26" y="-48" width="52" height="3" rx="1.5" fill="#3c4247" />
		<path d="M-28 -34 h20 M8 -34 h20" stroke="#6f787e" stroke-width="1" />

		<!-- regulator and controller -->
		<rect x="14" y="-8" width="13" height="9" rx="1.2" fill="#1d2124" />
		<rect x="-26" y="2" width="20" height="13" rx="1.5" fill="#1d2124" stroke="#0a0c0d" stroke-width="0.8" />
		<circle cx="-22" cy="5" r="1.1" fill="#5e666b" />
		<text x="-16" y="11" font-family="ui-sans-serif, system-ui, sans-serif" font-size="2.8" fill="#9aa2a7" text-anchor="middle">SD</text>

		<text x="6" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="5.6" letter-spacing="0.8" fill="#c8f0d6" text-anchor="middle">microSD</text>

		<!-- 7-pin header -->
		<rect x="-44" y="52" width="88" height="9" rx="1.5" fill="#161616" />
		<g stroke="#b7bdc2" stroke-width="2.2">
			<line x1="-36" y1="54" x2="-36" y2="58" />
			<line x1="-24" y1="54" x2="-24" y2="58" />
			<line x1="-12" y1="54" x2="-12" y2="58" />
			<line x1="0" y1="54" x2="0" y2="58" />
			<line x1="12" y1="54" x2="12" y2="58" />
			<line x1="24" y1="54" x2="24" y2="58" />
			<line x1="36" y1="54" x2="36" y2="58" />
		</g>
		<g fill="#d5af52" stroke="#a8843a" stroke-width="0.6">
			<rect x="-38.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="-26.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="-14.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="-2.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="9.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="21.5" y="55.5" width="5" height="5" rx="1" />
			<rect x="33.5" y="55.5" width="5" height="5" rx="1" />
		</g>
		<g fill="#d6f2de" font-family="ui-sans-serif, system-ui, sans-serif" font-size="2.7" text-anchor="middle">
			<text x="-36" y="49.5">CD</text>
			<text x="-24" y="49.5">DO</text>
			<text x="-12" y="49.5">GND</text>
			<text x="0" y="49.5">SCK</text>
			<text x="12" y="49.5">VCC</text>
			<text x="24" y="49.5">DI</text>
			<text x="36" y="49.5">CS</text>
		</g>
	</g>
</svg>
