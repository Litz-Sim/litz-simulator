<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -52 112 104">
	<defs>
		<linearGradient id="pcb" x1="0" y1="-36" x2="0" y2="36" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#265f9e" />
			<stop offset="1" stop-color="#173f6b" />
		</linearGradient>
		<linearGradient id="patch" x1="0" y1="-36" x2="0" y2="-8" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#efe7d0" />
			<stop offset="1" stop-color="#d6cbab" />
		</linearGradient>
		<linearGradient id="metal" x1="0" y1="-48" x2="0" y2="-34" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#e4e8eb" />
			<stop offset="1" stop-color="#9ba3a9" />
		</linearGradient>
	</defs>
	<g stroke-linecap="round">
		<rect x="-42" y="-36" width="84" height="70" rx="3" fill="url(#pcb)" stroke="#102b4a" stroke-width="1.2" />
		<circle cx="-35" cy="-30" r="2.3" fill="#0d2547" />
		<circle cx="35" cy="-30" r="2.3" fill="#0d2547" />

		<!-- ceramic patch antenna -->
		<rect x="-23" y="-36" width="46" height="32" rx="1" fill="url(#metal)" stroke="#7d858a" stroke-width="0.9" />
		<rect x="-19" y="-33" width="38" height="26" rx="1" fill="url(#patch)" stroke="#b9ad8c" stroke-width="0.9" />
		<g stroke="#c3b795" stroke-width="0.9">
			<line x1="0" y1="-33" x2="0" y2="-7" />
			<line x1="-19" y1="-20" x2="19" y2="-20" />
		</g>
		<g fill="#a99d7d">
			<circle cx="-15" cy="-29" r="1.1" />
			<circle cx="15" cy="-29" r="1.1" />
		</g>

		<!-- NEO-6M receiver -->
		<rect x="-16" y="-2" width="32" height="18" rx="1.5" fill="#1d2124" stroke="#0a0c0d" stroke-width="0.8" />
		<circle cx="-11" cy="2" r="1.2" fill="#5e666b" />
		<text x="0" y="9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.4" fill="#9aa2a7" text-anchor="middle">NEO-6M</text>
		<rect x="22" y="4" width="12" height="7" rx="3.5" fill="#cfd5da" stroke="#7d858a" stroke-width="0.8" />

		<!-- SMA antenna jack -->
		<circle cx="48" cy="-22" r="7" fill="url(#metal)" stroke="#6f787e" stroke-width="1" />
		<circle cx="48" cy="-22" r="4" fill="none" stroke="#7d858a" stroke-width="0.9" />
		<circle cx="48" cy="-22" r="1.4" fill="#3c4247" />
		<rect x="40" y="-25" width="8" height="6" fill="#b7bdc2" />

		<text x="24" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.4" fill="#a9c6e8" text-anchor="middle">u-blox</text>

		<!-- 4-pin header -->
		<rect x="-40" y="27" width="80" height="9" rx="1.5" fill="#161616" />
		<g stroke="#b7bdc2" stroke-width="2.2">
			<line x1="-30" y1="29" x2="-30" y2="36" />
			<line x1="-10" y1="29" x2="-10" y2="36" />
			<line x1="10" y1="29" x2="10" y2="36" />
			<line x1="30" y1="29" x2="30" y2="36" />
		</g>
		<g fill="#d5af52" stroke="#a8843a" stroke-width="0.6">
			<rect x="-32.5" y="33.5" width="5" height="5" rx="1" />
			<rect x="-12.5" y="33.5" width="5" height="5" rx="1" />
			<rect x="7.5" y="33.5" width="5" height="5" rx="1" />
			<rect x="27.5" y="33.5" width="5" height="5" rx="1" />
		</g>
		<g fill="#d9e7f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="3.2" text-anchor="middle">
			<text x="-30" y="25">VCC</text>
			<text x="-10" y="25">GND</text>
			<text x="10" y="25">TX</text>
			<text x="30" y="25">RX</text>
		</g>
	</g>
</svg>
